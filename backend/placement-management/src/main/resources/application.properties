# ================================================================
#  Online Placement Management System — Backend Configuration
# ================================================================

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:cGxhY2VtZW50LW1hbmFnZW1lbnQtc3lzdGVtLXN1cGVyLXNlY3JldC1rZXktMjAyNi1mZWF0dXJlLWF1dGg=}
jwt.expiration.ms=${JWT_EXPIRATION:86400000}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION:604800000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

logging.level.com.placement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads/resumes}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
